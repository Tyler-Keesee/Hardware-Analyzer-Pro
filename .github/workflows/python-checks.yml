name: Hardware Analyzer Python checks
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'requirements.txt', 'run.py', 'dev_setup.ps1', 'dev_setup.bat', 'setup.bat', 'launch.bat', 'README.md', '.github/workflows/python-checks.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'requirements.txt', 'run.py', 'dev_setup.ps1', 'dev_setup.bat', 'setup.bat', 'launch.bat', 'README.md', '.github/workflows/python-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q src tests run.py
      - name: Hardware manager tests (CPU-only Linux runner)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
